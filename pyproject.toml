[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markowitz-portfolio-optimizer"
version = "0.1.0"
description = "Mean-variance (Markowitz) portfolio optimization for a configurable basket of tickers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
markowitz = "markowitz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
